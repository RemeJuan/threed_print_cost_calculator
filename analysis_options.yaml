include: package:flutter_lints/flutter.yaml
linter:
  rules:
    public_member_api_docs: false
    constant_identifier_names: false
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"
    - "build/*"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore
